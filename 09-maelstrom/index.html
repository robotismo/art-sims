<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass }   from 'three/addons/postprocessing/AfterimagePass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';

/* ─────────────────────────  constants / state  ───────────────────────── */
const BOUND = 110.0, KILL = 180.0;
const MAX_VORT = 40;                // fixed GLSL array size — uVortices[40]
const PRESETS = [
  { tex:768,  label:'0.6M' },
  { tex:1024, label:'1.0M' },
  { tex:1448, label:'2.1M' },
  { tex:2048, label:'4.2M' },
];
const LOW_END = matchMedia('(pointer: coarse)').matches || Math.min(screen.width, screen.height) < 700;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let presetIdx = LOW_END ? 0 : 1;   // desktop default MED = 1024² on Apple Silicon; phones/tablets start at the smallest preset
let modeExposure = 0.095;          // tracer-sheet exposure
const ui = {
  swirl: 1.0,       // overall circulation scale (uSwirl multiplier)
  numVort: 40,      // active vortex count
  drift: 14/100,    // uDrift (global time scaling)
  glow:  0.62,      // bloom strength
  trails: true,
};

/* ─────────────────────────  shared GLSL chunks  ───────────────────────── */
const HASH = `
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
vec3 hash33(vec3 p3){
  p3=fract(p3*vec3(0.1031,0.1030,0.0973));
  p3+=dot(p3,p3.yxz+33.33);
  return fract((p3.xxy+p3.yxx)*p3.zyx);
}`;

// Ashima / Stefan Gustavson 3D simplex noise (public domain)
const SNOISE = `
vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x,289.0); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159-0.85373472095314*r; }
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+1.0*C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 snoiseVec3(vec3 x){
  return vec3(snoise(x),
              snoise(x+vec3(123.4,517.1,931.7)),
              snoise(x+vec3(-415.3,251.9,-741.2)));
}
vec3 curlNoise(vec3 p){
  const float e=0.18;
  vec3 dx=vec3(e,0.0,0.0), dy=vec3(0.0,e,0.0), dz=vec3(0.0,0.0,e);
  vec3 px0=snoiseVec3(p-dx), px1=snoiseVec3(p+dx);
  vec3 py0=snoiseVec3(p-dy), py1=snoiseVec3(p+dy);
  vec3 pz0=snoiseVec3(p-dz), pz1=snoiseVec3(p+dz);
  float x=(py1.z-py0.z)-(pz1.y-pz0.y);
  float y=(pz1.x-pz0.x)-(px1.z-px0.z);
  float z=(px1.y-px0.y)-(py1.x-py0.x);
  return vec3(x,y,z)/(2.0*e);
}`;

// seed positions (shared by both compute shaders so reseed is consistent)
// MAELSTROM — filled disk in the x-y plane (faces camera), thin z jitter.
const SEED = `
uniform float uBound, uDiskThick;
vec3 seedPosition(vec2 ref, float t){
  vec3 h = hash33(vec3(ref*vec2(443.7,191.3), t*0.017));
  float rr = uBound*sqrt(h.x);          // uniform-area fill of the disk
  float a  = h.y*6.28318530718;
  float zz = (h.z-0.5)*uDiskThick;      // thin z jitter
  return vec3(rr*cos(a), rr*sin(a), zz);
}`;

/* ─────────────────────────  velocity compute shader  ───────────────────────── */
const VELOCITY_FRAG = `
uniform float uTime, uDelta;
uniform float uDrift, uShimmer;
uniform float uKillRadius, uContain, uFlatten;
uniform vec4  uVortices[40];          // xy=pos, z=gamma(circulation), w=core
uniform int   uNumVort;
uniform vec3  uMouseOrigin, uMouseDir;
uniform float uStirStrength, uStirRadius, uStirRadial;
${HASH}
${SNOISE}
${SEED}

vec3 clampLen(vec3 v, float m){ float l=length(v); return l>m ? v*(m/l) : v; }

// Biot–Savart induced velocity in the x-y plane: sum over point vortices.
// v = Σ (Γ/2π) · perp(p−c)/(|p−c|²+core²),  perp(d)=(−d.y, d.x)
vec3 vortexField(vec3 pos){
  vec2 p = pos.xy;
  vec2 v2 = vec2(0.0);
  for(int i=0;i<40;i++){
    if(i>=uNumVort) break;
    vec4 vt = uVortices[i];
    vec2 d  = p - vt.xy;
    float r2 = dot(d,d) + vt.w*vt.w;     // softened core
    v2 += (vt.z/6.28318530718) * vec2(-d.y, d.x) / r2;
  }
  float aZ = -pos.z*uFlatten;            // keep the sheet thin (restore toward z=0)
  return vec3(v2, aZ);
}

vec3 pointerForce(vec3 pos){
  if(uStirStrength<=0.001) return vec3(0.0);
  vec3 o=uMouseOrigin, d=uMouseDir;
  float t = max(dot(pos-o,d), 0.0);
  vec3 closest = o + d*t;
  vec3 toP = pos - closest;
  float dist = length(toP)+1e-3;
  float fall = exp(-(dist*dist)/(uStirRadius*uStirRadius));
  vec3 tang = normalize(cross(d, toP)+vec3(1e-5));
  vec3 rad  = toP/dist;
  return (tang + rad*uStirRadial) * uStirStrength * fall;
}
vec3 containment(vec3 pos){
  float dl = length(pos)+1e-3;
  float k = smoothstep(uBound*0.9, uBound*1.5, dl);
  return -(pos/dl)*k*uContain;
}

void main(){
  vec2 uv = gl_FragCoord.xy/resolution.xy;
  vec4 P  = texture2D(texturePosition, uv);
  vec3 pos = P.xyz; float life = P.w;
  vec4 V  = texture2D(textureVelocity, uv);
  vec3 vel = V.xyz; float age = V.w;

  bool reseed = (life<=0.0) || (length(pos)>uKillRadius);

  vec3 shared = (pointerForce(pos)+containment(pos))*uDelta;

  // induced velocity field + a small curl-noise shimmer for life
  vec3 field = vortexField(pos);
  field += curlNoise(pos*0.018 + uTime*0.22)*uShimmer;

  vec3 nv = mix(vel, field, 0.3) + shared;
  nv = clampLen(nv, 220.0);

  if(reseed){
    vec3 sp = seedPosition(uv, uTime);
    nv = vortexField(sp);                 // start moving with the field at respawn
    age = 0.0;
  } else {
    age += uDelta;
  }
  gl_FragColor = vec4(nv, age);
}`;

/* ─────────────────────────  position compute shader  ───────────────────────── */
const POSITION_FRAG = `
uniform float uTime, uDelta, uKillRadius, uLifeRate;
${HASH}
${SEED}
void main(){
  vec2 uv = gl_FragCoord.xy/resolution.xy;
  vec4 P = texture2D(texturePosition, uv);
  vec3 pos = P.xyz; float life = P.w;
  vec3 vel = texture2D(textureVelocity, uv).xyz;

  bool reseed = (life<=0.0) || (length(pos)>uKillRadius);
  if(reseed){
    pos  = seedPosition(uv, uTime);
    life = 0.55 + 0.45*hash11(uv.x*51.3+uv.y*19.1+uTime*0.013);
  } else {
    pos += vel*uDelta;
    float rate = uLifeRate*(0.5+hash11(uv.x*131.7+uv.y*97.3));
    life -= rate*uDelta;
  }
  gl_FragColor = vec4(pos, life);
}`;

/* ─────────────────────────  render shaders (THREE.Points)  ───────────────────────── */
const POINTS_VERT = `
uniform sampler2D texturePosition;
uniform sampler2D textureVelocity;
uniform float uPointSize, uPixelRatio, uSpeedScale;
attribute vec2 reference;
varying float vSpeed; varying float vLife; varying float vDepth;
void main(){
  vec4 P = texture2D(texturePosition, reference);
  vec3 pos = P.xyz; vLife = P.w;
  vec3 vel = texture2D(textureVelocity, reference).xyz;
  vSpeed = clamp(length(vel)/uSpeedScale, 0.0, 1.0);
  vec4 mv = modelViewMatrix * vec4(pos,1.0);
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
  float size = uPointSize*uPixelRatio*(360.0/max(-mv.z,1.0));
  size *= 0.45 + 0.55*vSpeed;
  size *= smoothstep(0.0,0.12,vLife);
  gl_PointSize = clamp(size, 0.0, 14.0);
}`;

const POINTS_FRAG = `
precision highp float;
uniform float uExposure, uFogDensity, uWarm;
varying float vSpeed; varying float vLife; varying float vDepth;
vec3 ramp(float t){
  // emerald -> teal -> gold -> pale -> white  (authored in linear space)
  vec3 c0=vec3(0.04,0.40,0.24);   // deep emerald  #2f9e6f-ish (calm sheets)
  vec3 c1=vec3(0.07,0.58,0.46);   // teal
  vec3 c2=vec3(0.92,0.70,0.22);   // warm gold     #e8c45e
  vec3 c3=vec3(1.05,0.95,0.64);   // pale gold     #f6e6a8
  vec3 c4=vec3(1.35,1.26,1.08);   // hot white (HDR) — fast vortex cores
  vec3 c;
  if(t<0.46)      c=mix(c0,c1,smoothstep(0.0,0.46,t));
  else if(t<0.72) c=mix(c1,c2,smoothstep(0.46,0.72,t));
  else if(t<0.90) c=mix(c2,c3,smoothstep(0.72,0.90,t));
  else            c=mix(c3,c4,smoothstep(0.90,1.0,t));
  return c;
}
void main(){
  vec2 d = gl_PointCoord-0.5;
  float r2 = dot(d,d);
  if(r2>0.25) discard;
  float a = exp(-r2*5.5);                 // soft gaussian sprite
  float t = clamp(vSpeed + uWarm*0.18, 0.0, 1.0);
  vec3 col = ramp(t);
  float fade = smoothstep(0.0,0.18,vLife);
  float fog  = exp(-vDepth*uFogDensity);
  vec3 c = col * a * fade * fog * uExposure;
  gl_FragColor = vec4(c, a*fade*fog);
}`;

/* ─────────────────────────  renderer / scene  ───────────────────────── */
const canvas = document.getElementById('c');
const stage  = document.getElementById('stage');
const banner = document.getElementById('banner');
/* ── GPGPU guard (CONVENTIONS d): needs WebGL2 + float render targets. Probe a THROWAWAY canvas —
      never the real one, because context attributes stick on the first getContext call. ── */
{
  let gpgpuOK = false;
  try {
    const probe = document.createElement('canvas');
    const gl = probe.getContext('webgl2');
    gpgpuOK = !!(gl && gl.getExtension('EXT_color_buffer_float'));
    const lose = gl && gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
  } catch (e) { gpgpuOK = false; }
  if (!gpgpuOK) {
    banner.style.display = 'flex';
    banner.innerHTML = '<div>This piece simulates millions of particles on the GPU and needs WebGL2 with '
      + 'floating-point render targets.<br><small>This browser or device does not provide them.</small>'
      + '<br><br><a href="../">&larr; All simulations</a></div>';
    for (const id of ['hint', 'hud']) { const el = document.getElementById(id); if (el) el.style.display = 'none'; }
    const ctl = document.querySelector('.controls'); if (ctl) ctl.style.display = 'none';
    await new Promise(() => {});   // stop this module here: top-level await that never settles, no thrown error
  }
}

let renderer, scene, camera, controls, composer, bloomPass, afterPass, gpu;
let posVar, velVar, simU, points, geomRef = null;
let texSize = PRESETS[presetIdx].tex;
const timer = new THREE.Timer(); timer.connect(document);

function stageSize(){ return { w: stage.clientWidth||1100, h: stage.clientHeight||640 }; }
renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, LOW_END ? 1 : 2));
{ const s=stageSize(); renderer.setSize(s.w, s.h, false); }
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

scene = new THREE.Scene();
scene.background = makeBackgroundTexture();

{ const s=stageSize(); camera = new THREE.PerspectiveCamera(56, s.w/s.h, 1, 5000); }
camera.position.set(0, 90, 250);          // slightly tilted — plane reads mostly face-on with depth

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 40;
controls.maxDistance = 1400;
controls.autoRotateSpeed = 0.45;

function makeBackgroundTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const rad = g.createRadialGradient(256,210,30, 256,256,360);
  rad.addColorStop(0,'#0c1512'); rad.addColorStop(0.55,'#070d0b'); rad.addColorStop(1,'#04070a');
  g.fillStyle = rad; g.fillRect(0,0,512,512);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}

/* ─────────────────────────  point-vortex CPU dynamics  ───────────────────────── */
// Each vortex: {pos:Vector2, gamma (circulation +/-), core}.  Advected by mutual induction.
const vortices = [];               // active list (length === ui.numVort, capped at MAX_VORT)
const VORT_BOUND = BOUND*0.86;     // disk the vortices wander within (reflect at edge)
const uVortData = new Float32Array(MAX_VORT*4);   // packed vec4[40] for the uniform

function randVortex(){
  const a = Math.random()*Math.PI*2;
  const r = VORT_BOUND*Math.sqrt(Math.random())*0.9;
  const sign = Math.random()<0.5 ? -1 : 1;
  const mag = 0.55 + 0.45*Math.random();        // circulation magnitude (scaled by uSwirl)
  return {
    pos: new THREE.Vector2(Math.cos(a)*r, Math.sin(a)*r),
    gamma: sign*mag,
    core: 6.0 + 6.0*Math.random(),
  };
}
function scatterVortices(){
  vortices.length = 0;
  const n = Math.max(2, Math.min(MAX_VORT, Math.round(ui.numVort)));
  for(let i=0;i<n;i++) vortices.push(randVortex());
}
// inject a vortex at a world point on the plane (z≈0).  dir: +1 CCW, -1 CW
function injectVortex(x, y, dir){
  if(vortices.length >= MAX_VORT) vortices.shift();   // make room (FIFO)
  vortices.push({
    pos: new THREE.Vector2(x, y),
    gamma: dir*(0.9+0.5*Math.random()),
    core: 7.0,
  });
}

// advance the vortices by mutual induction (Biot–Savart), softened & reflected in the disk
function stepVortices(dt){
  const n = vortices.length;
  if(n===0) return;
  const TWO_PI = 6.28318530718;
  const gscale = 120.0 * ui.swirl;        // world circulation scale Γ
  const vel = [];
  for(let i=0;i<n;i++){
    const ci = vortices[i].pos;
    let vx=0, vy=0;
    for(let j=0;j<n;j++){
      if(j===i) continue;
      const cj = vortices[j];
      const dx = ci.x - cj.pos.x, dy = ci.y - cj.pos.y;
      const r2 = dx*dx + dy*dy + cj.core*cj.core;
      const g = (cj.gamma*gscale)/TWO_PI;
      // v = (Γ/2π) · perp(c_i − c_j)/(|·|²+core²),  perp(d)=(−d.y, d.x)
      vx += g * (-dy)/r2;
      vy += g * ( dx)/r2;
    }
    vel.push(vx, vy);
  }
  for(let i=0;i<n;i++){
    const v = vortices[i].pos;
    v.x += vel[i*2]   * dt;
    v.y += vel[i*2+1] * dt;
    // reflect within the bounded disk so they wander / orbit / pair up
    const r = Math.hypot(v.x, v.y);
    if(r > VORT_BOUND){
      const nx = v.x/r, ny = v.y/r;
      const over = r - VORT_BOUND;
      v.x -= 2*over*nx; v.y -= 2*over*ny;   // fold back inside
    }
  }
}

// pack the active vortices into the uniform array (xy=pos, z=gamma·scale, w=core)
function packVortices(){
  const n = vortices.length;
  const gscale = 120.0 * ui.swirl;
  for(let i=0;i<MAX_VORT;i++){
    const k=i*4;
    if(i<n){
      const v = vortices[i];
      uVortData[k]   = v.pos.x;
      uVortData[k+1] = v.pos.y;
      uVortData[k+2] = v.gamma*gscale;       // Γ passed in world units
      uVortData[k+3] = v.core;
    } else {
      uVortData[k]=uVortData[k+1]=uVortData[k+2]=uVortData[k+3]=0;
    }
  }
  if(simU){
    simU.uVortices.value = uVortData;
    simU.uNumVort.value  = n;
  }
}

/* ─────────────────────────  GPGPU init / rebuild  ───────────────────────── */
function makeSimUniforms(){
  return {
    uTime:{value:0}, uDelta:{value:0},
    uDrift:{value:ui.drift}, uShimmer:{value:2.4},
    uBound:{value:BOUND}, uKillRadius:{value:KILL}, uContain:{value:60.0}, uDiskThick:{value:7.0},
    uFlatten:{value:1.6}, uLifeRate:{value:0.075},
    uVortices:{value:uVortData}, uNumVort:{value:vortices.length},
    uMouseOrigin:{value:new THREE.Vector3()}, uMouseDir:{value:new THREE.Vector3(0,0,-1)},
    uStirStrength:{value:0.0}, uStirRadius:{value:46.0}, uStirRadial:{value:0.0},
  };
}

function buildSim(size){
  texSize = size;
  if(gpu){ gpu.dispose && gpu.dispose(); }
  gpu = new GPUComputationRenderer(size, size, renderer);
  if(renderer.capabilities.isWebGL2 === false){ /* r184 is WebGL2-only */ }

  const dtPos = gpu.createTexture();
  const dtVel = gpu.createTexture();
  seedTextures(dtPos, dtVel, size);

  velVar = gpu.addVariable('textureVelocity', VELOCITY_FRAG, dtVel);
  posVar = gpu.addVariable('texturePosition', POSITION_FRAG, dtPos);
  gpu.setVariableDependencies(velVar, [posVar, velVar]);
  gpu.setVariableDependencies(posVar, [posVar, velVar]);

  simU = makeSimUniforms();
  // share the SAME uniform objects across both materials -> one update point
  for(const k in simU){ velVar.material.uniforms[k] = simU[k]; }
  for(const k of ['uTime','uDelta','uKillRadius','uLifeRate','uBound','uDiskThick']){
    posVar.material.uniforms[k] = simU[k];
  }

  let err = gpu.init();
  if(err !== null){
    // float-render unsupported -> try half float
    gpu.setDataType && gpu.setDataType(THREE.HalfFloatType);
    err = gpu.init();
    if(err !== null){ showBanner('This GPU can’t render to float textures, so the particle engine can’t run.<br>'+err); throw new Error(err); }
  }
  buildPoints(size);
  applyDefaults(true);
  packVortices();
  document.getElementById('push').textContent = '▲ Push it · '+PRESETS[presetIdx].label;
}

function seedTextures(dtPos, dtVel, size){
  const p = dtPos.image.data, v = dtVel.image.data;
  for(let i=0;i<size*size;i++){
    const k=i*4;
    // initial filled disk in the x-y plane; compute shader recycles dust within a few frames
    const rr=BOUND*Math.sqrt(Math.random()), a=Math.random()*Math.PI*2;
    p[k  ]=Math.cos(a)*rr; p[k+1]=Math.sin(a)*rr; p[k+2]=(Math.random()-0.5)*7.0;
    p[k+3]=Math.random();                       // life
    v[k]=v[k+1]=v[k+2]=0; v[k+3]=Math.random()*5; // velocity + age
  }
}

function buildPoints(size){
  const n = size*size;
  if(points){ scene.remove(points); points.geometry.dispose(); points.material.dispose(); }
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(n*3);     // placeholder (real pos comes from texture)
  const refs = new Float32Array(n*2);
  for(let i=0;i<n;i++){
    refs[i*2]   = (i%size)/size;
    refs[i*2+1] = Math.floor(i/size)/size;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geom.setAttribute('reference', new THREE.BufferAttribute(refs,2));
  geomRef = geom;

  const mat = new THREE.ShaderMaterial({
    uniforms:{
      texturePosition:{value:null}, textureVelocity:{value:null},
      uPointSize:{value:1.5}, uPixelRatio:{value:renderer.getPixelRatio()},
      uSpeedScale:{value:90.0}, uExposure:{value:0.095}, uFogDensity:{value:0.0017}, uWarm:{value:0.0},
    },
    vertexShader: POINTS_VERT, fragmentShader: POINTS_FRAG,
    transparent:true, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false,
  });
  points = new THREE.Points(geom, mat);
  points.frustumCulled = false;
  scene.add(points);
}

/* ─────────────────────────  post-processing  ───────────────────────── */
function buildComposer(){
  if(composer){ for(const p of composer.passes) p.dispose(); composer.dispose(); }   // free the old passes' render targets on rebuild
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  { const s=stageSize(); bloomPass = new UnrealBloomPass(new THREE.Vector2(s.w, s.h), ui.glow, 0.62, 0.52); }
  composer.addPass(bloomPass);
  afterPass = new AfterimagePass(0.88);            // silky streamlines — trails read the billows
  afterPass.enabled = ui.trails;
  composer.addPass(afterPass);
  composer.addPass(new OutputPass());
  sizeComposer();
}
function sizeComposer(){
  const s=stageSize();
  // keep the composer's render targets at the renderer's CURRENT pixel ratio: the governor changes it at runtime, and a
  // stale ratio drew pr-scaled points into 1x targets (phones started at pr 1, climbed to 2, and washed out to grey)
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(s.w,s.h);
  const br = (texSize>=1448)?0.5:1.0;             // halve bloom res at high counts
  bloomPass.setSize(s.w*br, s.h*br);
}

/* ─────────────────────────  defaults  ───────────────────────── */
function applyDefaults(instant){
  simU.uShimmer.value = 2.4;  simU.uContain.value = 60;  simU.uLifeRate.value = 0.075;
  points.material.uniforms.uSpeedScale.value = 90; points.material.uniforms.uWarm.value = 0.0;
  points.material.uniforms.uPointSize.value = 1.5;
  modeExposure = 0.095;
  afterPass && (afterPass.enabled = ui.trails);
  document.getElementById('modechip').textContent = 'VORTICES';
  updateCaption();
}

/* ─────────────────────────  pointer interaction  ───────────────────────── */
const ndc = new THREE.Vector2();
let stirTarget = 0, lastInput = performance.now(), pointerDown = false, pointerBtn = 0;
const _planeForRay = new THREE.Plane(new THREE.Vector3(0,0,1), 0);   // z=0 plane
const _ray = new THREE.Ray(), _hit = new THREE.Vector3();

function setRayFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  const o = camera.getWorldPosition(new THREE.Vector3());
  const far = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(camera);
  simU.uMouseOrigin.value.copy(o);
  simU.uMouseDir.value.copy(far.sub(o).normalize());
}
// unproject the cursor onto the z=0 plane; returns Vector3 or null
function cursorOnPlane(e){
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  const o = camera.getWorldPosition(new THREE.Vector3());
  const far = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(camera);
  _ray.origin.copy(o); _ray.direction.copy(far.sub(o).normalize());
  return _ray.intersectPlane(_planeForRay, _hit) ? _hit.clone() : null;
}
// spin of a spawned whirlpool: +1 CCW, -1 CW. A left click or a tap uses spinDir; a right click uses the
// opposite. The "spin" button flips spinDir, so touch (no right click) can spawn both directions.
let spinDir = 1;
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', ()=>{
  spinDir = -spinDir; spinBtn.textContent = 'spin: '+(spinDir>0 ? '↺ CCW' : '↻ CW'); spinBtn.setAttribute('aria-pressed', String(spinDir<0));
});
const dirFor = btn => (btn===2) ? -spinDir : spinDir;
canvas.addEventListener('pointermove', e=>{
  setRayFromEvent(e);
  stirTarget = pointerDown ? 130 : 64;
  // while dragging, swirl the dust radially in the held direction (CCW inward / CW outward)
  if(pointerDown){ simU.uStirRadial.value = dirFor(pointerBtn)>0 ? -1.4 : 1.4; }
  else { simU.uStirRadial.value = 0.0; }
  lastInput = performance.now();
});
canvas.addEventListener('pointerdown', e=>{
  pointerDown=true; pointerBtn=e.button; setRayFromEvent(e); stirTarget=130; lastInput=performance.now();
  // inject a vortex at the unprojected cursor-on-plane (left / tap = spinDir, right = opposite).
  // Only the primary pointer spawns, so the second finger of a pinch does not drop an extra whirlpool.
  if(!e.isPrimary) return;
  const hit = cursorOnPlane(e);
  if(hit){ injectVortex(hit.x, hit.y, dirFor(e.button)); packVortices(); }
});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev, ()=>{ pointerDown=false; simU.uStirRadial.value=0.0; }));
canvas.addEventListener('contextmenu', e=>e.preventDefault());
['pointerdown','wheel','keydown'].forEach(ev=>window.addEventListener(ev, ()=>lastInput=performance.now(), {passive:true}));

let paused = false;
if(matchMedia('(pointer: coarse)').matches) document.getElementById('hint').textContent = 'tap to spawn a whirlpool · drag to orbit & stir · pinch to dive';
const ppBtn = document.getElementById('playpause');
function setPaused(p){ paused = p; ppBtn.textContent = p ? '▶ Play' : '❚❚ Pause'; ppBtn.setAttribute('aria-pressed', String(p)); }
ppBtn.addEventListener('click', ()=>setPaused(!paused));
// Space toggles pause. A mouse or touch click drops focus from the button it hit (Safari never focuses it), so a
// later Space pauses instead of re-firing that button ("Push it" again). A button reached by keyboard (Tab) keeps
// focus, and Space activates it as usual; Space in a text field is left alone.
document.addEventListener('click', e=>{ const b = e.target.closest && e.target.closest('button'); if(b && e.detail>0) b.blur(); });
window.addEventListener('keydown', e=>{
  if(e.code!=='Space') return;
  const a = document.activeElement, tag = a ? a.tagName : '';
  if(tag==='BUTTON' || tag==='TEXTAREA' || tag==='SELECT' || (a && a.isContentEditable) || (tag==='INPUT' && a.type!=='range')) return;
  e.preventDefault();
  if(!e.repeat) setPaused(!paused);
});

/* ─────────────────────────  controls / UI  ───────────────────────── */
document.getElementById('reseed').addEventListener('click', ()=>{ reseedAll(); if(paused) settle(SETTLE); });   // paused: apply the reseed now
document.getElementById('s_swirl').addEventListener('input', e=>{ ui.swirl=(+e.target.value)/100; packVortices(); });
document.getElementById('s_vort').addEventListener('input',  e=>{ ui.numVort=+e.target.value; scatterVortices(); packVortices(); });
document.getElementById('s_drift').addEventListener('input', e=>{ ui.drift=(+e.target.value)/100; simU.uDrift.value=ui.drift; });
document.getElementById('s_glow').addEventListener('input',  e=>{ ui.glow=(+e.target.value)/100; bloomPass.strength=ui.glow; });
document.getElementById('trails').addEventListener('click', e=>{
  ui.trails=!ui.trails; e.target.classList.toggle('on',ui.trails); e.target.textContent='trails: '+(ui.trails?'on':'off');
  afterPass.enabled = ui.trails;
});
document.getElementById('push').addEventListener('click', ()=>{
  presetIdx = (presetIdx+1)%PRESETS.length;
  ceilingIdx = presetIdx;
  rebuildAt(PRESETS[presetIdx].tex);
  if(paused) settle(SETTLE);        // paused: show a settled field, not the raw seed shell
});
document.getElementById('save').addEventListener('click', ()=>{
  composer.render();
  const a=document.createElement('a');
  a.download='maelstrom.png';
  a.href=renderer.domElement.toDataURL('image/png'); a.click();
});

function reseedAll(){
  // re-scatter the whirlpools and force the dust to respawn into the disk
  scatterVortices(); packVortices();
  simU.uTime.value += 137.5;
  forceReseedPulse = 2;             // frames where lifeRate is huge -> all particles expire & respawn
}
let forceReseedPulse = 0;

function rebuildAt(size){
  buildSim(size);
  buildComposer();
  applyDefaults(true);
  packVortices();
}

/* ─────────────────────────  captions  ───────────────────────── */
const SPINE = `A sea of massless dust drifts on the <b>induced velocity field</b> of up to forty point vortices — the whole field is just one sum, evaluated on the GPU.`;
const CLAUSE = `This is <span class="live">point-vortex dynamics</span>: each whirlpool's velocity falls off like <b>1/r</b> (the 2-D <b>Biot–Savart law</b>), and the vortices <b>advect one another</b> — orbiting, pairing, merging. The tracer dust reveals <b>2-D inviscid turbulence</b>: shearing sheets, Kelvin–Helmholtz billows, vortex streets — the same math behind <b>hurricanes</b> and <b>Jupiter's Great Red Spot</b>.`;
function updateCaption(){
  document.getElementById('caption').innerHTML = SPINE+' '+CLAUSE;
}

/* ─────────────────────────  perf governor  ───────────────────────── */
let emaMs = 16.7, drawFrac = 1.0, ceilingIdx = presetIdx, lastScale = performance.now();
function governor(dtMs){
  dtMs = Math.min(dtMs, 100);          // ignore tab-switch / stall spikes, not a perf signal
  emaMs = emaMs*0.92 + dtMs*0.08;
  const fps = 1000/emaMs;
  const now = performance.now();
  if(fps < 48 && now-lastScale > 700){
    if(drawFrac > 0.45){ drawFrac = Math.max(0.45, drawFrac-0.12); lastScale=now; }
    else if(renderer.getPixelRatio() > 1.0){ renderer.setPixelRatio(Math.max(1.0, renderer.getPixelRatio()-0.25)); onResize(); lastScale=now; }
  } else if(fps > 58 && now-lastScale > 2600){
    if(renderer.getPixelRatio() < Math.min(window.devicePixelRatio||1,2)){ renderer.setPixelRatio(Math.min(Math.min(window.devicePixelRatio||1,2), renderer.getPixelRatio()+0.25)); onResize(); lastScale=now; }
    else if(drawFrac < 1.0){ drawFrac = Math.min(1.0, drawFrac+0.08); lastScale=now; }
  }
  const n = texSize*texSize;
  geomRef.setDrawRange(0, Math.floor(n*drawFrac));
}

/* ─────────────────────────  resize  ───────────────────────── */
function onResize(){
  const s=stageSize();
  renderer.setSize(s.w,s.h,false);
  camera.aspect=s.w/s.h; camera.updateProjectionMatrix();
  if(composer) sizeComposer();
  if(points) points.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', onResize);
if(window.ResizeObserver){ new ResizeObserver(()=>onResize()).observe(stage); }

/* ─────────────────────────  main loop  ───────────────────────── */
function animate(){
  requestAnimationFrame(animate);
  timer.update(); const dtMs = timer.getDelta()*1000;
  const dt = Math.min(dtMs/1000, 1/45);
  frame(dt, dtMs);
}
// Push/Reseed while paused (the reduced-motion default): advance the sim SETTLE steps over the next frames without
// drawing (4 steps per frame, so the page never blocks), then run the last 24 steps with drawing in one task. That
// rebuilds the trails, and only the final still frame reaches the screen. Same pattern as 08-magnetosphere.
const SETTLE = 300;
let settleLeft = 0;
function settle(n){ settleLeft = n; }
function simStep(dt){
  // reseed pulse (Reseed button)
  if(forceReseedPulse>0){ simU.uLifeRate.value = 14.0; forceReseedPulse--; if(forceReseedPulse===0) applyDefaults(true); }

  const tscale = (0.4+1.2*ui.drift);
  simU.uTime.value += dt*tscale;
  simU.uDelta.value = dt;

  // advance the point vortices on the CPU (mutual induction), then push to the shader
  stepVortices(dt*tscale*60.0);    // vortices live in the same time-scaled world as the dust
  packVortices();

  gpu.compute();
}
function draw(){
  // feed current sim textures to the draw material
  points.material.uniforms.texturePosition.value = gpu.getCurrentRenderTarget(posVar).texture;
  points.material.uniforms.textureVelocity.value = gpu.getCurrentRenderTarget(velVar).texture;
  points.material.uniforms.uExposure.value = modeExposure;
  if(bloomPass) bloomPass.strength = ui.glow;

  composer.render();
}
function frame(dt, dtMs){
  // stir decay
  simU.uStirStrength.value += (stirTarget - simU.uStirStrength.value)*0.25;
  stirTarget *= 0.86;

  // idle auto-orbit after 6s
  controls.autoRotate = !REDUCED && !paused && (performance.now()-lastInput > 6000);
  document.getElementById('hint').style.opacity = (performance.now()-lastInput>6000)?'0':'0.7';

  if(!paused) settleLeft = 0;
  const settling = paused && settleLeft > 0;
  if(settling){
    if(settleLeft > 24){ for(let i=0;i<4 && settleLeft>24;i++,settleLeft--) simStep(1/60); }
    else { while(settleLeft>0){ simStep(1/60); settleLeft--; if(settleLeft>0) draw(); } }   // one task: only the final frame is shown
  }
  else if(!paused) simStep(dt);

  controls.update();
  if(!settling || settleLeft===0) draw();   // while settling, keep the old frame on screen
  if(!paused) governor(dtMs);   // a paused still frame must not change resolution or draw range

  // HUD
  if((animate._f=(animate._f||0)+1)%12===0){
    const fps = Math.round(1000/emaMs);
    const drawn = (texSize*texSize*drawFrac/1e6).toFixed(2);
    document.getElementById('hud').innerHTML = `<b>${drawn}M</b> dust · <b>${vortices.length}</b> vortices · <b>${fps}</b> fps · ${texSize}²`;
  }
}

function showBanner(html){ banner.style.display='flex'; banner.innerHTML=html; }

/* ─────────────────────────  boot  ───────────────────────── */
try{
  scatterVortices();
  buildSim(PRESETS[presetIdx].tex);
  buildComposer();
  updateCaption();
  onResize();
  // debug/verification hook: step the sim+render N frames even when the tab is hidden (rAF is paused)
  window.__sim = { frame, step:(n=1,dt=1/60)=>{ for(let i=0;i<n;i++) frame(dt, dt*1000); }, reseedAll, injectVortex, scatterVortices,
                   fit:(w,h)=>{ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); sizeComposer(); points.material.uniforms.uPixelRatio.value=renderer.getPixelRatio(); },
                   set:(k,v)=>{ if(simU[k]) simU[k].value=v; else if(points.material.uniforms[k]) points.material.uniforms[k].value=v; },
                   get state(){ return {texSize, drawFrac:+drawFrac.toFixed(2), fps:Math.round(1000/emaMs), numVort:vortices.length}; } };
  animate();
  if(REDUCED){ window.__sim.step(SETTLE); setPaused(true); }   // reduced motion: settle the field, then hold a still frame
}catch(err){
  console.error(err);
  if(banner.style.display!=='flex') showBanner('Could not start WebGL2 / the particle engine.<br><small>'+(err&&err.message||err)+'</small>');
}
</script>
</body>
</html>
