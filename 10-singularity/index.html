<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }

<script type="module">
import * as THREE from 'three';
import { GPUComputationRenderer } from 'three/addons/misc/GPUComputationRenderer.js';
import { EffectComposer }   from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }       from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass }  from 'three/addons/postprocessing/UnrealBloomPass.js';
import { AfterimagePass }   from 'three/addons/postprocessing/AfterimagePass.js';
import { OutputPass }       from 'three/addons/postprocessing/OutputPass.js';
import { OrbitControls }    from 'three/addons/controls/OrbitControls.js';

/* ─────────────────────────  constants / state  ───────────────────────── */
const BOUND = 110.0, KILL = 200.0;          // disk outer scale / hard kill radius
const PRESETS = [
  { tex:768,  label:'0.6M' },
  { tex:1024, label:'1.0M' },
  { tex:1448, label:'2.1M' },
  { tex:2048, label:'4.2M' },
];
let presetIdx = 1;                 // default MED = 1024² on Apple Silicon
let modeExposure = 0.04;           // base points exposure
const ui = {
  mass:  220.0,     // uGM
  spin:  16/100,    // drift dt scale (orbital pace)
  beam:  1.05,      // uBeam
  glow:  0.92,      // bloom strength
  trails: true,
};

/* ─────────────────────────  shared GLSL chunks  ───────────────────────── */
const HASH = `
float hash11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
vec3 hash33(vec3 p3){
  p3=fract(p3*vec3(0.1031,0.1030,0.0973));
  p3+=dot(p3,p3.yxz+33.33);
  return fract((p3.xxy+p3.yxx)*p3.zyx);
}`;

// Ashima / Stefan Gustavson 3D simplex noise (public domain)
const SNOISE = `
vec4 permute(vec4 x){ return mod(((x*34.0)+1.0)*x,289.0); }
vec4 taylorInvSqrt(vec4 r){ return 1.79284291400159-0.85373472095314*r; }
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+1.0*C.xxx; vec3 x2=x0-i2+2.0*C.xxx; vec3 x3=x0-1.0+3.0*C.xxx;
  i=mod(i,289.0);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=1.0/7.0; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 snoiseVec3(vec3 x){
  return vec3(snoise(x),
              snoise(x+vec3(123.4,517.1,931.7)),
              snoise(x+vec3(-415.3,251.9,-741.2)));
}
vec3 curlNoise(vec3 p){
  const float e=0.18;
  vec3 dx=vec3(e,0.0,0.0), dy=vec3(0.0,e,0.0), dz=vec3(0.0,0.0,e);
  vec3 px0=snoiseVec3(p-dx), px1=snoiseVec3(p+dx);
  vec3 py0=snoiseVec3(p-dy), py1=snoiseVec3(p+dy);
  vec3 pz0=snoiseVec3(p-dz), pz1=snoiseVec3(p+dz);
  float x=(py1.z-py0.z)-(pz1.y-pz0.y);
  float y=(pz1.x-pz0.x)-(px1.z-px0.z);
  float z=(px1.y-px0.y)-(py1.x-py0.x);
  return vec3(x,y,z)/(2.0*e);
}`;

// seed positions (shared by both compute shaders so reseed is consistent)
// accretion disk: thin annulus in the x-y plane, radius in [uRin,uRout]
const SEED = `
uniform float uRin, uRout, uDiskThick;
vec3 seedPosition(vec2 ref, float t){
  vec3 h = hash33(vec3(ref*vec2(443.7,191.3), t*0.017));
  float rr = mix(uRin, uRout, sqrt(h.x));     // area-uniform annulus, biased outward by sqrt
  float a  = h.y*6.28318530718;
  float zz = (h.z-0.5)*uDiskThick;            // thin vertical scatter
  return vec3(rr*cos(a), rr*sin(a), zz);
}`;

/* ─────────────────────────  velocity compute shader  ───────────────────────── */
// Newtonian central gravity + viscous drag + thin-disk vertical restoring.
// Horizon recycle: r<uRs reseeds the particle on a fresh outer near-circular orbit.
const VELOCITY_FRAG = `
uniform float uTime, uDelta;
uniform float uGM, uEps, uRs, uDrag, uDiskThin, uOrbitRelax;
uniform float uKillRadius, uSpeedClamp;
uniform vec3  uMouseOrigin, uMouseDir;
uniform float uStirStrength, uStirRadius, uStirRadial;
${HASH}
${SNOISE}
${SEED}

vec3 clampLen(vec3 v, float m){ float l=length(v); return l>m ? v*(m/l) : v; }

// tangential circular speed for a near-circular orbit at pos (disk in x-y plane)
vec3 circularVel(vec3 pos){
  vec2 pl = pos.xy; float r = length(pl)+1e-3;
  vec2 rh = pl/r; vec2 th = vec2(-rh.y, rh.x);   // counter-clockwise tangent
  float vc = sqrt(uGM/r);
  return vec3(th.x*vc, th.y*vc, 0.0);
}

// gravitational + viscous + vertical-restoring acceleration
vec3 diskAccel(vec3 pos, vec3 vel){
  float r = length(pos);
  vec3 rh = pos/(r+1e-4);
  vec3 a = -rh*uGM/(r*r+uEps);                   // strong central gravity
  a += -vel*uDrag;                               // viscosity -> slow inward migration
  a += vec3(0.0, 0.0, -pos.z*uDiskThin - vel.z*0.6); // thin-disk vertical restoring + damp
  return a;
}

vec3 pointerForce(vec3 pos){
  if(uStirStrength<=0.001) return vec3(0.0);
  vec3 o=uMouseOrigin, d=uMouseDir;
  float t = max(dot(pos-o,d), 0.0);
  vec3 closest = o + d*t;
  vec3 toP = pos - closest;
  float dist = length(toP)+1e-3;
  float fall = exp(-(dist*dist)/(uStirRadius*uStirRadius));
  vec3 tang = normalize(cross(d, toP)+vec3(1e-5));
  vec3 rad  = toP/dist;
  return (tang + rad*uStirRadial) * uStirStrength * fall;
}

void main(){
  vec2 uv = gl_FragCoord.xy/resolution.xy;
  vec4 P  = texture2D(texturePosition, uv);
  vec3 pos = P.xyz; float life = P.w;
  vec4 V  = texture2D(textureVelocity, uv);
  vec3 vel = V.xyz; float age = V.w;

  float r = length(pos);
  bool reseed = (life<=0.0) || (r < uRs) || (r > uKillRadius); // horizon recycle + life recycle

  vec3 a = diskAccel(pos, vel);
  vec3 nv = vel + a*uDelta;

  // gentle relax toward circular speed keeps coherent orbital streaks
  nv = mix(nv, circularVel(pos), uOrbitRelax);

  // faint turbulent shimmer in the disk + pointer feed
  nv += curlNoise(pos*0.035 + uTime*0.25) * 1.4;
  nv += pointerForce(pos)*uDelta;

  nv = clampLen(nv, uSpeedClamp);

  if(reseed){
    vec3 sp = seedPosition(uv, uTime);
    nv = circularVel(sp);
    // tiny inward bias so fresh matter slowly spirals in
    nv -= normalize(sp)*length(nv)*0.012;
    age = 0.0;
  } else {
    age += uDelta;
  }
  gl_FragColor = vec4(nv, age);
}`;

/* ─────────────────────────  position compute shader  ───────────────────────── */
const POSITION_FRAG = `
uniform float uTime, uDelta, uKillRadius, uLifeRate, uRs;
${HASH}
${SEED}
void main(){
  vec2 uv = gl_FragCoord.xy/resolution.xy;
  vec4 P = texture2D(texturePosition, uv);
  vec3 pos = P.xyz; float life = P.w;
  vec3 vel = texture2D(textureVelocity, uv).xyz;

  float r = length(pos);
  bool reseed = (life<=0.0) || (r < uRs) || (r > uKillRadius);
  if(reseed){
    pos  = seedPosition(uv, uTime);
    life = 0.55 + 0.45*hash11(uv.x*51.3+uv.y*19.1+uTime*0.013);
  } else {
    pos += vel*uDelta;
    float rate = uLifeRate*(0.5+hash11(uv.x*131.7+uv.y*97.3));
    life -= rate*uDelta;
  }
  gl_FragColor = vec4(pos, life);
}`;

/* ─────────────────────────  render shaders (THREE.Points)  ───────────────────────── */
// MODIFIED for Singularity: temperature-by-radius ramp + relativistic Doppler beaming.
const POINTS_VERT = `
uniform sampler2D texturePosition;
uniform sampler2D textureVelocity;
uniform float uPointSize, uPixelRatio, uSpeedScale;
uniform float uRin, uRout, uRs, uBeam;
attribute vec2 reference;
varying float vSpeed; varying float vLife; varying float vDepth;
varying float vTemp; varying float vBeam; varying float vRing;
void main(){
  vec4 P = texture2D(texturePosition, reference);
  vec3 pos = P.xyz; vLife = P.w;
  vec3 vel = texture2D(textureVelocity, reference).xyz;
  vSpeed = clamp(length(vel)/uSpeedScale, 0.0, 1.0);

  float r = length(pos);
  // temperature scalar: 1 = hot inner edge, 0 = cool outer rim
  vTemp = clamp((uRout - r)/(uRout - uRin), 0.0, 1.0);

  // world-space position (Points has identity model matrix, but keep it general)
  vec4 worldPos = modelMatrix * vec4(pos,1.0);
  vec3 toCam = normalize(cameraPosition - worldPos.xyz);
  // relativistic Doppler beaming: approaching material (vel toward camera) blazes
  float beam = 1.0 + uBeam * dot(normalize(vel+vec3(1e-5)), toCam);
  vBeam = clamp(beam, 0.2, 3.0);

  // thin photon-ring brightness bump near r ~ 1.5*Rs
  float ringR = 1.5*uRs;
  vRing = exp(-pow((r-ringR)/(0.42*uRs), 2.0));

  vec4 mv = modelViewMatrix * vec4(pos,1.0);
  vDepth = -mv.z;
  gl_Position = projectionMatrix * mv;
  float size = uPointSize*uPixelRatio*(360.0/max(-mv.z,1.0));
  size *= 0.55 + 0.75*vTemp;                 // hotter inner motes a touch larger
  size *= smoothstep(0.0,0.12,vLife);
  gl_PointSize = clamp(size, 0.0, 14.0);
}`;

const POINTS_FRAG = `
precision highp float;
uniform float uExposure, uFogDensity, uGlowMix;
varying float vSpeed; varying float vLife; varying float vDepth;
varying float vTemp; varying float vBeam; varying float vRing;
vec3 ramp(float t){
  // outer cool emerald -> teal -> gold -> pale -> hot white inner (blackbody-ish, authored linear)
  vec3 c0=vec3(0.04,0.40,0.24);   // deep emerald  (cool outer disk)
  vec3 c1=vec3(0.07,0.58,0.46);   // teal
  vec3 c2=vec3(0.92,0.70,0.22);   // warm gold     #e8c45e
  vec3 c3=vec3(1.05,0.95,0.64);   // pale gold     #f6e6a8
  vec3 c4=vec3(1.45,1.34,1.16);   // hot white (HDR, inner edge)
  vec3 c;
  if(t<0.46)      c=mix(c0,c1,smoothstep(0.0,0.46,t));
  else if(t<0.72) c=mix(c1,c2,smoothstep(0.46,0.72,t));
  else if(t<0.90) c=mix(c2,c3,smoothstep(0.72,0.90,t));
  else            c=mix(c3,c4,smoothstep(0.90,1.0,t));
  return c;
}
void main(){
  vec2 d = gl_PointCoord-0.5;
  float r2 = dot(d,d);
  if(r2>0.25) discard;
  float a = exp(-r2*5.5);                 // soft gaussian sprite
  // temperature drives color; blend in a little speed for inner-orbit sparkle
  float t = clamp(vTemp + uGlowMix*vSpeed*0.22, 0.0, 1.0);
  vec3 col = ramp(t);
  col += vec3(0.30,0.27,0.20)*vRing;      // photon-ring brightening
  float fade = smoothstep(0.0,0.18,vLife);
  float fog  = exp(-vDepth*uFogDensity);
  float bright = uExposure * vBeam;        // relativistic Doppler beaming
  vec3 c = col * a * fade * fog * bright;
  gl_FragColor = vec4(c, a*fade*fog);
}`;

/* ─────────────────────────  renderer / scene  ───────────────────────── */
const canvas = document.getElementById('c');
const stage  = document.getElementById('stage');
const banner = document.getElementById('banner');

let renderer, scene, camera, controls, composer, bloomPass, afterPass, gpu;
let posVar, velVar, simU, points, geomRef = null;
let texSize = PRESETS[presetIdx].tex;
const clock = new THREE.Clock();

function stageSize(){ return { w: stage.clientWidth||1100, h: stage.clientHeight||640 }; }
renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
{ const s=stageSize(); renderer.setSize(s.w, s.h, false); }
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

scene = new THREE.Scene();
scene.background = makeBackgroundTexture();

{ const s=stageSize(); camera = new THREE.PerspectiveCamera(56, s.w/s.h, 1, 5000); }
// inclined ~62° to the disk: beaming asymmetry + disk ellipse both strongly visible
camera.position.set(0, 246, 132);

controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 18;
controls.maxDistance = 1400;
controls.autoRotateSpeed = 0.45;

function makeBackgroundTexture(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  const rad = g.createRadialGradient(256,210,30, 256,256,360);
  rad.addColorStop(0,'#0c1512'); rad.addColorStop(0.55,'#070d0b'); rad.addColorStop(1,'#04070a');
  g.fillStyle = rad; g.fillRect(0,0,512,512);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace;
  return tx;
}

/* ─────────────────────────  GPGPU init / rebuild  ───────────────────────── */
function makeSimUniforms(){
  return {
    uTime:{value:0}, uDelta:{value:0},
    uGM:{value:ui.mass}, uEps:{value:6.0}, uRs:{value:20.0},
    uRin:{value:30.0}, uRout:{value:BOUND}, uDiskThick:{value:3.0},
    uDrag:{value:0.06}, uDiskThin:{value:15.0}, uOrbitRelax:{value:0.045},
    uKillRadius:{value:KILL}, uSpeedClamp:{value:120.0}, uLifeRate:{value:0.05},
    uMouseOrigin:{value:new THREE.Vector3()}, uMouseDir:{value:new THREE.Vector3(0,0,-1)},
    uStirStrength:{value:0.0}, uStirRadius:{value:42.0}, uStirRadial:{value:0.0},
  };
}

function buildSim(size){
  texSize = size;
  if(gpu){ gpu.dispose && gpu.dispose(); }
  gpu = new GPUComputationRenderer(size, size, renderer);
  if(renderer.capabilities.isWebGL2 === false){ /* r184 is WebGL2-only */ }

  const dtPos = gpu.createTexture();
  const dtVel = gpu.createTexture();
  seedTextures(dtPos, dtVel, size);

  velVar = gpu.addVariable('textureVelocity', VELOCITY_FRAG, dtVel);
  posVar = gpu.addVariable('texturePosition', POSITION_FRAG, dtPos);
  gpu.setVariableDependencies(velVar, [posVar, velVar]);
  gpu.setVariableDependencies(posVar, [posVar, velVar]);

  simU = makeSimUniforms();
  // share the SAME uniform objects across both materials -> one update point
  for(const k in simU){ velVar.material.uniforms[k] = simU[k]; }
  for(const k of ['uTime','uDelta','uKillRadius','uLifeRate','uRs','uRin','uRout','uDiskThick']){
    posVar.material.uniforms[k] = simU[k];
  }

  let err = gpu.init();
  if(err !== null){
    // float-render unsupported -> try half float
    gpu.setDataType && gpu.setDataType(THREE.HalfFloatType);
    err = gpu.init();
    if(err !== null){ showBanner('This GPU can’t render to float textures, so the particle engine can’t run.<br>'+err); throw new Error(err); }
  }
  buildPoints(size);
  applyTuning(true);
  document.getElementById('push').textContent = '▲ Push it · '+PRESETS[presetIdx].label;
}

function seedTextures(dtPos, dtVel, size){
  const p = dtPos.image.data, v = dtVel.image.data;
  const Rin = 14.0, Rout = BOUND, GM = ui.mass, thick = 5.0;
  for(let i=0;i<size*size;i++){
    const k=i*4;
    // seed directly into a thin x-y disk annulus on near-circular orbits
    const rr = Rin + (Rout-Rin)*Math.sqrt(Math.random());
    const a  = Math.random()*Math.PI*2;
    const x = Math.cos(a)*rr, y = Math.sin(a)*rr, z = (Math.random()-0.5)*thick;
    p[k  ]=x; p[k+1]=y; p[k+2]=z;
    p[k+3]=Math.random();                       // life
    // tangential circular velocity (counter-clockwise) + tiny inward bias
    const vc = Math.sqrt(GM/rr);
    const tx = -y/rr, ty = x/rr;
    v[k]=tx*vc - (x/rr)*vc*0.012; v[k+1]=ty*vc - (y/rr)*vc*0.012; v[k+2]=0;
    v[k+3]=Math.random()*5;                     // age
  }
}

function buildPoints(size){
  const n = size*size;
  if(points){ scene.remove(points); points.geometry.dispose(); points.material.dispose(); }
  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(n*3);     // placeholder (real pos comes from texture)
  const refs = new Float32Array(n*2);
  for(let i=0;i<n;i++){
    refs[i*2]   = (i%size)/size;
    refs[i*2+1] = Math.floor(i/size)/size;
  }
  geom.setAttribute('position', new THREE.BufferAttribute(positions,3));
  geom.setAttribute('reference', new THREE.BufferAttribute(refs,2));
  geomRef = geom;

  const mat = new THREE.ShaderMaterial({
    uniforms:{
      texturePosition:{value:null}, textureVelocity:{value:null},
      uPointSize:{value:1.5}, uPixelRatio:{value:renderer.getPixelRatio()},
      uSpeedScale:{value:80.0}, uExposure:{value:0.04}, uFogDensity:{value:0.0017}, uGlowMix:{value:1.0},
      uRin:{value:30.0}, uRout:{value:BOUND}, uRs:{value:20.0}, uBeam:{value:ui.beam},
    },
    vertexShader: POINTS_VERT, fragmentShader: POINTS_FRAG,
    transparent:true, blending:THREE.AdditiveBlending, depthTest:false, depthWrite:false,
  });
  points = new THREE.Points(geom, mat);
  points.frustumCulled = false;
  scene.add(points);
}

/* ─────────────────────────  post-processing  ───────────────────────── */
function buildComposer(){
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  { const s=stageSize(); bloomPass = new UnrealBloomPass(new THREE.Vector2(s.w, s.h), ui.glow, 0.62, 0.52); }
  composer.addPass(bloomPass);
  afterPass = new AfterimagePass(0.88);
  afterPass.enabled = ui.trails;
  composer.addPass(afterPass);
  composer.addPass(new OutputPass());
  sizeComposer();
}
function sizeComposer(){
  const s=stageSize();
  composer.setSize(s.w,s.h);
  const br = (texSize>=1448)?0.5:1.0;             // halve bloom res at high counts
  bloomPass.setSize(s.w*br, s.h*br);
}

/* ─────────────────────────  tuning (single-mode)  ───────────────────────── */
function applyTuning(instant){
  simU.uGM.value = ui.mass;
  // keep the points material in sync with disk geometry + beaming
  const pu = points.material.uniforms;
  pu.uRin.value  = simU.uRin.value;
  pu.uRout.value = simU.uRout.value;
  pu.uRs.value   = simU.uRs.value;
  pu.uBeam.value = ui.beam;
  pu.uSpeedScale.value = 80;
  pu.uPointSize.value = 1.5;
  modeExposure = 0.085;
  afterPass && (afterPass.enabled = ui.trails);
  updateCaption();
}

/* ─────────────────────────  pointer interaction  ───────────────────────── */
const ndc = new THREE.Vector2();
let stirTarget = 0, lastInput = performance.now(), pointerDown = false, pointerBtn = 0;
function setRayFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  ndc.x = ((e.clientX-rect.left)/rect.width)*2-1;
  ndc.y = -((e.clientY-rect.top)/rect.height)*2+1;
  const o = camera.getWorldPosition(new THREE.Vector3());
  const far = new THREE.Vector3(ndc.x, ndc.y, 0.5).unproject(camera);
  simU.uMouseOrigin.value.copy(o);
  simU.uMouseDir.value.copy(far.sub(o).normalize());
}
canvas.addEventListener('pointermove', e=>{
  setRayFromEvent(e);
  stirTarget = pointerDown ? 150 : 70;
  // right-drag flings dust outward, left-drag pulls it inward (feeds the disk)
  simU.uStirRadial.value = pointerDown ? (pointerBtn===2?2.0:-2.0) : 0.0;
  lastInput = performance.now();
});
canvas.addEventListener('pointerdown', e=>{ pointerDown=true; pointerBtn=e.button; setRayFromEvent(e); stirTarget=150; lastInput=performance.now(); });
window.addEventListener('pointerup', ()=>{ pointerDown=false; });
canvas.addEventListener('contextmenu', e=>e.preventDefault());
['pointerdown','wheel','keydown'].forEach(ev=>window.addEventListener(ev, ()=>lastInput=performance.now(), {passive:true}));

let paused = false;
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ paused=!paused; e.preventDefault(); } });

/* ─────────────────────────  controls / UI  ───────────────────────── */
document.getElementById('reseed').addEventListener('click', reseedAll);
document.getElementById('s_mass').addEventListener('input', e=>{ ui.mass=(+e.target.value); simU.uGM.value=ui.mass; });
document.getElementById('s_spin').addEventListener('input', e=>{ ui.spin=(+e.target.value)/100; });
document.getElementById('s_beam').addEventListener('input', e=>{ ui.beam=(+e.target.value)/100; points.material.uniforms.uBeam.value=ui.beam; });
document.getElementById('s_glow').addEventListener('input',  e=>{ ui.glow=(+e.target.value)/100; bloomPass.strength=ui.glow; });
document.getElementById('trails').addEventListener('click', e=>{
  ui.trails=!ui.trails; e.target.classList.toggle('on',ui.trails); e.target.textContent='trails: '+(ui.trails?'on':'off');
  afterPass.enabled = ui.trails;
});
document.getElementById('push').addEventListener('click', ()=>{
  presetIdx = (presetIdx+1)%PRESETS.length;
  ceilingIdx = presetIdx;
  rebuildAt(PRESETS[presetIdx].tex);
});
document.getElementById('save').addEventListener('click', ()=>{
  composer.render();
  const a=document.createElement('a');
  a.download='singularity.png';
  a.href=renderer.domElement.toDataURL('image/png'); a.click();
});

function reseedAll(){
  // jump uTime so the seed hash decorrelates, then force everyone to reseed for a couple of frames
  simU.uTime.value += 137.5;
  forceReseedPulse = 2;             // frames where lifeRate is huge -> all particles expire & respawn
}
let forceReseedPulse = 0;

function rebuildAt(size){
  buildSim(size);
  buildComposer();
  applyTuning(true);
}

/* ─────────────────────────  caption  ───────────────────────── */
function updateCaption(){
  document.getElementById('caption').innerHTML =
    `A <b>relativistic accretion disk</b>: central gravity (<b>a = −GM r̂/r²</b>) pulls matter into ever-faster inner orbits, so the temperature <span class="live">rises inward</span> — emerald rim to white-hot edge. Viscosity drains it slowly across the <b>Schwarzschild horizon</b>, and <b>relativistic Doppler beaming</b> blazes the side rotating toward you into a bright crescent — the same physics in the Event Horizon Telescope image of <b>M87★</b>.`;
}

/* ─────────────────────────  perf governor  ───────────────────────── */
let emaMs = 16.7, drawFrac = 1.0, ceilingIdx = presetIdx, lastScale = performance.now();
function governor(dtMs){
  dtMs = Math.min(dtMs, 100);          // ignore tab-switch / stall spikes, not a perf signal
  emaMs = emaMs*0.92 + dtMs*0.08;
  const fps = 1000/emaMs;
  const now = performance.now();
  if(fps < 48 && now-lastScale > 700){
    if(drawFrac > 0.45){ drawFrac = Math.max(0.45, drawFrac-0.12); lastScale=now; }
    else if(renderer.getPixelRatio() > 1.0){ renderer.setPixelRatio(Math.max(1.0, renderer.getPixelRatio()-0.25)); onResize(); lastScale=now; }
  } else if(fps > 58 && now-lastScale > 2600){
    if(renderer.getPixelRatio() < Math.min(window.devicePixelRatio||1,2)){ renderer.setPixelRatio(Math.min(Math.min(window.devicePixelRatio||1,2), renderer.getPixelRatio()+0.25)); onResize(); lastScale=now; }
    else if(drawFrac < 1.0){ drawFrac = Math.min(1.0, drawFrac+0.08); lastScale=now; }
  }
  const n = texSize*texSize;
  geomRef.setDrawRange(0, Math.floor(n*drawFrac));
}

/* ─────────────────────────  resize  ───────────────────────── */
function onResize(){
  const s=stageSize();
  renderer.setSize(s.w,s.h,false);
  camera.aspect=s.w/s.h; camera.updateProjectionMatrix();
  if(composer) sizeComposer();
  if(points) points.material.uniforms.uPixelRatio.value = renderer.getPixelRatio();
}
window.addEventListener('resize', onResize);
if(window.ResizeObserver){ new ResizeObserver(()=>onResize()).observe(stage); }

/* ─────────────────────────  main loop  ───────────────────────── */
function animate(){
  requestAnimationFrame(animate);
  const dtMs = clock.getDelta()*1000;
  const dt = Math.min(dtMs/1000, 1/45);
  frame(dt, dtMs);
}
function frame(dt, dtMs){
  // stir decay
  simU.uStirStrength.value += (stirTarget - simU.uStirStrength.value)*0.25;
  stirTarget *= 0.86;

  // idle auto-orbit after 6s
  controls.autoRotate = (performance.now()-lastInput > 6000);
  document.getElementById('hint').style.opacity = (performance.now()-lastInput>6000)?'0':'0.7';

  if(!paused){
    // reseed pulse (Reseed button)
    if(forceReseedPulse>0){ simU.uLifeRate.value = 14.0; forceReseedPulse--; if(forceReseedPulse===0) simU.uLifeRate.value = 0.05; }

    simU.uTime.value += dt*(0.4+1.2*ui.spin); // global orbital pace scales with spin slider
    simU.uDelta.value = dt*(0.55+2.0*ui.spin); // physics step (spin = orbital drift dt)
    gpu.compute();
  }

  // feed current sim textures to the draw material
  points.material.uniforms.texturePosition.value = gpu.getCurrentRenderTarget(posVar).texture;
  points.material.uniforms.textureVelocity.value = gpu.getCurrentRenderTarget(velVar).texture;
  points.material.uniforms.uExposure.value = modeExposure;
  if(bloomPass) bloomPass.strength = ui.glow;

  controls.update();
  composer.render();
  governor(dtMs);

  // HUD
  if((animate._f=(animate._f||0)+1)%12===0){
    const fps = Math.round(1000/emaMs);
    const drawn = (texSize*texSize*drawFrac/1e6).toFixed(2);
    document.getElementById('hud').innerHTML = `<b>${drawn}M</b> pts · <b>${fps}</b> fps · ${texSize}²`;
  }
}

function showBanner(html){ banner.style.display='flex'; banner.innerHTML=html; }

/* ─────────────────────────  boot  ───────────────────────── */
try{
  buildSim(PRESETS[presetIdx].tex);
  buildComposer();
  updateCaption();
  onResize();
  // debug/verification hook: step the sim+render N frames even when the tab is hidden (rAF is paused)
  window.__sim = { frame, step:(n=1,dt=1/60)=>{ for(let i=0;i<n;i++) frame(dt, dt*1000); }, reseedAll,
                   fit:(w,h)=>{ renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); sizeComposer(); points.material.uniforms.uPixelRatio.value=renderer.getPixelRatio(); },
                   set:(k,v)=>{ if(simU[k]) simU[k].value=v; else if(points.material.uniforms[k]) points.material.uniforms[k].value=v; },
                   get state(){ return {texSize, drawFrac:+drawFrac.toFixed(2), fps:Math.round(1000/emaMs)}; } };
  animate();
}catch(err){
  console.error(err);
  if(banner.style.display!=='flex') showBanner('Could not start WebGL2 / the particle engine.<br><small>'+(err&&err.message||err)+'</small>');
}
</script>
</body>
</html>
